name: Release VRCXF

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    set_version:
        runs-on: ubuntu-slim
        outputs:
            version: ${{ steps.version.outputs.version }}
            date: ${{ steps.version.outputs.date }}
        steps:
            - uses: actions/checkout@v6
            - id: version
              run: |
                  export TZ=Asia/Tokyo
                  git_hash=$(git rev-parse --short "$GITHUB_SHA")
                  export FILENAME="$(date '+%Y.%m.%d')-${git_hash}"
                  export DATE="$(date '+%Y.%m.%d')"
                  echo "version=${FILENAME}" >> $GITHUB_OUTPUT
                  echo "date=${DATE}" >> $GITHUB_OUTPUT

    build_windows:
        runs-on: windows-latest
        needs: set_version
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: pnpm
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - uses: microsoft/setup-WinAppCli@v0.2
            - uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-deps-${{ hashFiles('Dotnet/VRCX-Cef.csproj') }}
                  restore-keys: ${{ runner.os }}-deps-
            - run: |
                  Set-Content -LiteralPath Version -Value '${{ needs.set_version.outputs.version }}'
                  $defines = @(
                      '!define PRODUCT_VERSION_FROM_FILE "${{ needs.set_version.outputs.date }}.0"'
                      '!define PRODUCT_DISPLAY_VERSION "${{ needs.set_version.outputs.version }}"'
                  )
                  Set-Content -LiteralPath Installer/version_define.nsh -Value $defines
            - run: |
                  pnpm i --frozen-lockfile --prefer-offline
                  pnpm prod
            - run: dotnet build Dotnet/VRCX-Cef.csproj -c Release -p:Platform=x64
            - run: |
                  Remove-Item -LiteralPath build/Cef/html -Force
                  Copy-Item -LiteralPath build/html -Destination build/Cef/html -Recurse
                  $manifestPath = 'build-scripts/msix/AppxManifest.xml'
                  $manifest = Get-Content -LiteralPath $manifestPath -Raw
                  $msixVersion = ([Version]'${{ needs.set_version.outputs.date }}.0').ToString()
                  $manifest = $manifest.Replace('Version="0.0.0.0"', "Version=`"$msixVersion`"")
                  Set-Content -LiteralPath $manifestPath -Value $manifest -NoNewline
                  winapp pack build/Cef --manifest $manifestPath --output 'VRCXF_${{ needs.set_version.outputs.version }}.msix' --skip-pri
            - run: choco install nsis -y
            - uses: joncloud/makensis-action@v5.0
              with:
                  script-file: Installer/installer.nsi
                  additional-plugin-paths: Installer/Plugins
            - run: Move-Item -LiteralPath Installer/VRCX_Setup.exe -Destination VRCXF_Setup.exe
            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: "${{ needs.set_version.outputs.version }}"
                  draft: true
                  files: |
                      VRCXF_${{ needs.set_version.outputs.version }}.msix
                      VRCXF_Setup.exe

    build_linux:
        runs-on: ubuntu-latest
        needs: set_version
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: pnpm
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.nuget/packages
                      ~/.cache/electron
                      ~/.cache/electron-builder
                  key: ${{ runner.os }}-deps-${{ hashFiles('Dotnet/VRCX-Electron*.csproj', 'pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-deps-
            - run: |
                  echo '${{ needs.set_version.outputs.version }}' > Version
                  pnpm i --frozen-lockfile --prefer-offline
            - run: dotnet build Dotnet/VRCX-Electron.csproj -c Release -p:Platform=x64
            - env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SentryAuthToken }}
              run: pnpm prod
            - run: |
                  pnpm build-electron
                  mv build/VRCX_*_x64.AppImage VRCXF_x64.AppImage
                  rm -rf build/Electron
            - run: dotnet build Dotnet/VRCX-Electron.csproj -c Release -p:Platform=ARM64 -a arm64
            - run: |
                  pnpm build-electron-arm64
                  mv build/VRCX_*_arm64.AppImage VRCXF_arm64.AppImage
                  rm -rf build/Electron
            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: "${{ needs.set_version.outputs.version }}"
                  draft: true
                  files: |
                      VRCXF_x64.AppImage
                      VRCXF_arm64.AppImage

    build_macos:
        runs-on: macos-latest
        needs: set_version
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: pnpm
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"
            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.nuget/packages
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                  key: ${{ runner.os }}-deps-${{ hashFiles('Dotnet/VRCX-Electron.csproj', 'pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-deps-
            - run: |
                  echo '${{ needs.set_version.outputs.version }}' > Version
                  pnpm i --frozen-lockfile --prefer-offline
            - run: dotnet build Dotnet/VRCX-Electron.csproj -c Release -p:Platform=ARM64 -a arm64
            - env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SentryAuthToken }}
              run: pnpm prod
            - run: |
                  pnpm build-electron-arm64
                  mv build/VRCX_*_arm64.dmg VRCXF_arm64.dmg
            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: "${{ needs.set_version.outputs.version }}"
                  draft: true
                  files: VRCXF_arm64.dmg

    build_bundle:
        runs-on: ubuntu-latest
        needs: set_version
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: pnpm
            - run: |
                  echo '${{ needs.set_version.outputs.version }}' > Version
                  pnpm i --frozen-lockfile --prefer-offline
            - run: pnpm prod
            - run: |
                  cd build/html
                  7z a -tzip ../../VRCXF_bundle.zip * -mx=7 -xr0!*.log
            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: "${{ needs.set_version.outputs.version }}"
                  draft: true
                  files: VRCXF_bundle.zip

    publish_release:
        runs-on: ubuntu-slim
        needs:
            [set_version, build_windows, build_linux, build_macos, build_bundle]
        steps:
            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: "${{ needs.set_version.outputs.version }}"
                  name: "VRCXF ${{ needs.set_version.outputs.version }}"

