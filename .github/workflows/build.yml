name: Build VRCXF

on:
    push:
        branches-ignore:
            - main

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_dotnet:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: '10.0.x'
            - run: dotnet build Dotnet/VRCX-Cef.csproj -c Release -p:Platform=x64
    build_node:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: pnpm
            - run: pnpm i --frozen-lockfile --prefer-offline
            - run: pnpm prod
