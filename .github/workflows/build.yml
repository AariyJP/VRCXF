name: Build VRCXF

on:
    push:
    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_node:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v4
            - name: Restore dependencies
              run: npm ci
            - name: Build browser
              run: npm run prod-browser
