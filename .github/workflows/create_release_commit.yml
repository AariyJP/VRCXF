name: Create Release Commit

on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        default: develop

concurrency:
  group: create-release-commit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-slim
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3566973
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main \
            -f head="${SOURCE_BRANCH}" \
            -f commit_message="$(TZ=Asia/Tokyo date '+%Y.%m.%d')"
